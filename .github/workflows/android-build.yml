name: Build & Release NetShare Hotspot APK

on:
  push:
    tags:
      - 'v*'       # Push events to matching v*, i.e. v1.0, v1.0.0
    branches:
      - main       # Builds and uploads artifacts on push to main
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write # Needed to create GitHub Releases

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare Environment & Keystore
        run: |
          # Ensure .env exists for the Secrets Gradle Plugin
          if [ ! -f .env ]; then
            cp .env.example .env || touch .env
          fi
          
          # Restore debug keystore if base64 encoded file exists
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Prepare Release Artifacts
        id: prepare_artifacts
        run: |
          mkdir -p release_output
          
          # Locate built APK
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          
          if [ -n "$APK_PATH" ]; then
            TAG="${{ github.ref_name }}"
            if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
              TAG="${{ github.event.inputs.tag_name }}"
            fi
            if [ -z "$TAG" ]; then
              TAG="v1.0.0"
            fi
            
            OUTPUT_NAME="NetShare-Hotspot-${TAG}.apk"
            cp "$APK_PATH" "release_output/$OUTPUT_NAME"
            echo "apk_path=release_output/$OUTPUT_NAME" >> $GITHUB_OUTPUT
            echo "apk_name=$OUTPUT_NAME" >> $GITHUB_OUTPUT
            echo "Found APK: $APK_PATH -> release_output/$OUTPUT_NAME"
          else
            echo "Error: No APK found!"
            exit 1
          fi

      - name: Upload Artifact (For main branch or workflow runs)
        uses: actions/upload-artifact@v4
        with:
          name: NetShare-Hotspot-APK
          path: release_output/*.apk
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.tag_name }}
          name: Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_output/*.apk
          body: |
            ### 📶 NetShare Hotspot Release
            
            **Download the APK directly to install on your Android device!**
            
            #### Features included:
            - **Custom SSID & Password:** Share your network with custom credentials.
            - **Live Wi-Fi QR Code:** Connect any device instantly by scanning the QR code without typing passwords.
            - **Network Inspector:** Monitor active Wi-Fi speed, IP, gateway, frequency, and run ping latency tests.
            - **Room Database Profiles:** Save custom hotspot presets for quick 1-tap switching.
            - **Local Web Share Portal:** Built-in web server (`http://<ip>:8080`) to share notes and messages across connected devices.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
